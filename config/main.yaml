global:
  api_request_timeout: 20
  batch_request_timeout: 60
  filter_debug: false
  site_id: 2489781
  timeout_seconds: 30
  timezone: Europe/Rome
  web_request_timeout: 40
gme:
  bucket: GME
  download_timeout_seconds: 30
  enabled: true
  password: ${GME_PASSWORD}
  retry_attempts: 3
  retry_delay_seconds: 2
  username: ${GME_USERNAME}
influxdb:
  batch_size: 500
  bucket: Solaredge
  dry_file: logs/influx_dry_points.jsonl
  dry_mode: false
  enable_gzip: true
  flush_interval_ms: 1000
  jitter_interval_ms: 100
  max_retries: 5
  org: fotovoltaico
  retry_interval_ms: 1000
  token: ${INFLUXDB_TOKEN}
  url: http://192.168.2.124:8086
  write_precision: s
logging:
  file_logging: true
  level: INFO
  log_directory: logs
scheduler:
  api_delay_seconds: 1
  gme_delay_seconds: 30
  realtime_delay_seconds: 0
  skip_delay_on_cache_hit: true
  web_delay_seconds: 2
solaredge:
  api:
    api_key: ${SOLAREDGE_API_KEY}
    base_url: https://monitoringapi.solaredge.com
    rate_limit_seconds: 1
    retry_attempts: 3
    retry_delay_seconds: 2
    site_id: 2489781
    timeout_seconds: 30
  modbus:
    enabled: true
    host: 192.168.2.225
    port: 1502
    retries: 3
    timeout: 1
    unit: 1
  web:
    base_url: https://monitoring.solaredge.com
    cookie_file: cookies/web_cookies.json
    login_url: https://monitoring.solaredge.com/solaredge-apigw/api/login
    password: ${SOLAREDGE_PASSWORD}
    session_timeout_seconds: 3600
    username: ${SOLAREDGE_USERNAME}
sources: {}
workflow:
  name: main
  version: 1.0
