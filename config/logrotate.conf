# SolarEdge Data Collector - Log Rotation Configuration
# copytruncate: il processo tiene aperto il FileHandler e non c'e' ExecReload,
# quindi ruotare per rename lascerebbe il servizio a scrivere nel file ruotato.
/opt/solaredge-collector/logs/*.log /opt/solaredge-collector/logs/*/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    copytruncate
}
